name: Sperrungen aktualisieren

on:
  schedule:
    - cron: "17 */3 * * *"   # alle drei Stunden
  workflow_dispatch:          # zusätzlich per Knopf unter "Actions" startbar

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Daten von Digitize the Planet abrufen
        run: python3 scripts/fetch_closures.py

      - name: Änderungen speichern
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "Keine Änderungen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Sperrungen und Hinweise aktualisiert"
          git push
