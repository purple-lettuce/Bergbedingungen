name: Lawinenlage aktualisieren

# Alle Lawinenwarndienste aus scripts/avalanche_sources.py (Euregio, Schweiz SLF), zweimal täglich und manuell startbar.
# 07:20 UTC: nach dem Morgen-Update des SLF (8 Uhr Ortszeit, nur im Winter) und außerplanmäßigen Euregio-Updates.
# 16:20 UTC: nach der Abendausgabe beider Dienste (17 Uhr Ortszeit = 16:00 UTC Winterzeit, 15:00 UTC Sommerzeit).
# Die Zeiten sind eine Projektentscheidung auf Basis der Veröffentlichungszeiten (siehe docs/LAWINENLAGE_ANALYSE.md).
# Die Dateien ändern sich nur bei neuem Inhalt, spätestens nach 7 Tagen. Fällt eine Quelle aus, werden die anderen
# trotzdem gespeichert und der Lauf meldet den Fehler.

on:
  schedule:
    - cron: "20 7 * * *"
    - cron: "20 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-avalanche
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Tests
        run: |
          python3 scripts/test_avalanche_model.py
          python3 scripts/test_fetch_avalanche.py
          python3 scripts/test_avalanche_framework.py

      - name: Lawinenlage abrufen
        id: fetch
        continue-on-error: true
        run: |
          python3 scripts/fetch_avalanche.py 2>&1 | tee avalanche.log

      - name: Zusammenfassung
        if: always()
        run: |
          { echo '### Lawinenlage'; echo '```'; cat avalanche.log 2>/dev/null || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Änderungen speichern
        run: |
          if [ -z "$(git status --porcelain data/avalanche)" ]; then
            echo "Keine Änderungen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/avalanche
          git commit -m "Lawinenlage aktualisiert"
          git pull --rebase
          git push

      - name: Fehler einer Quelle melden
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "Mindestens eine Lawinenwarndienst-Quelle konnte nicht abgerufen werden, siehe Protokoll oben."
          exit 1