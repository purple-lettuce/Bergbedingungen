<!doctype html>
<meta charset="utf-8">
<title>Tests Landing Page (LP1 bis LP8, LP1b)</title>
<pre id="result">läuft …</pre>
<div id="frames"></div>
<script>
// Läuft im Browser: python3 scripts/run_js_tests.py (oder diese Seite über einen Webserver im Repo-Stamm öffnen).
// Lädt die Startseite (index.html) in Rahmen unterschiedlicher Breite und prüft Marke, Claim, Slogan, genau einen Link zur Karte (der auf eine vorhandene Seite zeigt),
// fehlenden Überlauf und dass die Seite keine Skripte braucht. Außerdem: Die Anwendung (app.html) führt über die Marke zurück zur Startseite.
var results = [];
function ok(name, cond, detail) { results.push({ name: name, ok: !!cond, error: cond ? '' : 'nicht erfüllt' + (detail ? ': ' + detail : '') }); }
function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function openFrame(src, w, h) {
  return new Promise(function (resolve) {
    var f = document.createElement('iframe');
    f.style.cssText = 'display:block;border:0;width:' + w + 'px;height:' + h + 'px';
    f.src = src;
    f.addEventListener('load', function () { wait(500).then(function () { resolve(f); }); });
    document.getElementById('frames').appendChild(f);
  });
}
function text(d, sel) { var e = d.querySelector(sel); return e ? e.textContent.replace(/\s+/g, ' ').trim() : null; }

async function landing() {
  var f = await openFrame('../index.html', 1440, 900), d = f.contentDocument;
  ok('Marke: Emblem und Name als h1', d.querySelector('.mr-header img.mr-brand__emblem') && text(d, 'h1.mr-brand__name') === 'Mountain Radar');
  ok('Claim sichtbar', text(d, '.mr-brand__claim') === 'ALPINE RISK INTELLIGENCE');
  ok('Slogan sichtbar', text(d, '.mr-hero__title') === 'Know before you go.');
  var links = d.querySelectorAll('main a, main button');
  ok('Inhalt: genau eine Aktion, Link „Zur Karte“', links.length === 1 && links[0].textContent.trim() === 'Zur Karte' && links[0].getAttribute('href') === 'app.html', links.length + ' Aktionen');
  var res = await fetch(new URL(links[0].getAttribute('href'), f.contentWindow.location.href));
  ok('Ziel des Links ist erreichbar', res.ok, 'Status ' + res.status);
  ok('Seite braucht kein JavaScript', d.querySelectorAll('script').length === 0);
  ok('Die einzige Überschrift 1. Ebene ist der Produktname', d.querySelectorAll('h1').length === 1);
  var b = d.querySelector('.mr-button').getBoundingClientRect();
  ok('Aktion ist im ersten Bildschirm sichtbar (1440 × 900)', b.bottom <= 900 && b.height >= 44, 'unten ' + Math.round(b.bottom) + ', Höhe ' + Math.round(b.height));
  ok('Kein waagerechter Überlauf (1440 px)', d.documentElement.scrollWidth <= 1440);
}

async function small(w, h) {
  var f = await openFrame('../index.html', w, h), d = f.contentDocument, de = d.documentElement;
  var b = d.querySelector('.mr-button').getBoundingClientRect();
  ok(w + ' px: kein waagerechter Überlauf', de.scrollWidth <= w, 'Breite ' + de.scrollWidth);
  ok(w + ' px: Aktion liegt im Bildschirm und ist mindestens 44 px hoch', b.left >= 0 && b.right <= w && b.bottom <= h && b.height >= 44, Math.round(b.left) + '–' + Math.round(b.right) + ', unten ' + Math.round(b.bottom));
  var t = d.querySelector('.mr-hero__title').getBoundingClientRect();
  ok(w + ' px: Slogan liegt im Bildschirm', t.left >= 0 && t.right <= w);
}

async function lowWindow() {
  var f = await openFrame('../index.html', 667, 300), d = f.contentDocument, de = d.documentElement;
  var scrolls = de.scrollHeight > 300 && (f.contentWindow.scrollTo(0, de.scrollHeight), f.contentWindow.scrollY > 0);
  f.contentWindow.scrollTo(0, 0);
  ok('Niedriges Fenster (667 × 300): Seite scrollt, Aktion ist erreichbar', scrolls || de.scrollHeight <= 300);
  var b = d.querySelector('.mr-button').getBoundingClientRect();
  ok('Niedriges Fenster: Aktion nach dem Zurückscrollen an den Anfang sichtbar', b.top >= 0 && b.bottom <= 300, 'oben ' + Math.round(b.top) + ', unten ' + Math.round(b.bottom));
}

async function appBackLink() {

}

}async function vision() {
  var f = await openFrame('../index.html', 1440, 900), d = f.contentDocument;
  var sec = d.querySelector('#lp4-ari').closest('section');
  ok('LP4: Abschnitt „Alpine Risk Intelligence“ existiert', text(d, '#lp4-ari') === 'Alpine Risk Intelligence');
  var themes = Array.prototype.map.call(sec.querySelectorAll('.mr-vision-grid h3'), function (h) { return h.textContent.trim(); });

  ok('LP4: die drei Erklärungen (Informationen allein, Kontext, zusammen)', heads.length === 3, heads.join(' | '));
  var badge = sec.querySelector('.mr-badge');
  ok('LP4: Vision ist als „Noch nicht verfügbar“ gekennzeichnet, vor den Zukunftsthemen', badge && badge.textContent.trim() === 'Noch nicht verfügbar' && (badge.compareDocumentPosition(sec.querySelector('.mr-vision-grid')) & 4));

  ok('LP4: Zukunftskarten unterscheiden sich von den aktuellen (nicht raised)', sec.querySelectorAll('.mr-card--raised').length === 0);
  var t = sec.textContent;
  ok('LP4: kein KI-Hype (KI, Künstliche Intelligenz)', !/\bKI\b|künstliche/i.test(t.replace(/Intelligence/g, '')));
  ['revolution', 'smart', 'einzigartig', 'bahnbrechend', 'machine learning', 'jetzt', 'ab sofort', 'bereits heute'].forEach(function (w) {
    ok('LP4: keine Hype- oder Gegenwartsformulierung: ' + w, t.toLowerCase().indexOf(w) === -1);
  });

  ok('LP4: weiterhin genau eine Aktion im Inhalt', d.querySelectorAll('main a, main button').length === 1);
  ok('LP4: Seite ohne Skripte', d.querySelectorAll('script').length === 0);

async function datasources() {

  ok('LP5: die fünf Bereiche plus Kartengrundlage', JSON.stringify(cards) === JSON.stringify(['Wetter', 'Lawinenlage', 'Schutzgebiete', 'Wildlife', 'Sperrungen & Hinweise', 'Kartengrundlage']), cards.join(', '));
  var named = Array.prototype.every.call(sec.querySelectorAll('.mr-source-grid li'), function (li) { return li.querySelector('strong'); });
  ok('LP5: jede Karte nennt eine Quelle', named);
  var names = Array.prototype.map.call(sec.querySelectorAll('strong'), function (s) { return s.textContent.trim(); });
  var allowed = ['Open-Meteo', 'Lawinenwarndienste Tirol, Südtirol und Trentino (Euregio)', 'WSL-Institut für Schnee- und Lawinenforschung SLF', 'Digitize the Planet e.V.', 'OpenStreetMap-Mitwirkende', 'OpenTopoMap'];
  ok('LP5: nur reale, in der Anwendung genutzte Quellen', names.every(function (n) { return allowed.indexOf(n) !== -1; }), names.join(' | '));
  var t = (sec.textContent + d.querySelector('#lp5-hinweis').closest('section').textContent).toLowerCase();
  ['GeoSphere', 'Meteostat', 'Meteomatics', 'Météo-France', 'AINEVA', 'ARSO', 'Basemap', 'Alpinpolizei', 'Kuratorium', 'Tirol Data Hub', 'GPX', 'Risk Engine', 'geplant', 'künftig', 'Partner'].forEach(function (w) {
    ok('LP5: nicht erwähnt: ' + w, t.indexOf(w.toLowerCase()) === -1);
  });
  var hint = Array.prototype.map.call(d.querySelectorAll('#lp5-hinweis ~ .mr-notice-list li, .mr-notice-list li'), function (li) { return li.textContent.trim(); });
  ok('LP5: Hinweis (kein Ersatz für Tourenplanung, Quellen ändern sich, prüfen)', hint.length === 3 && /ersetzt keine Tourenplanung vor Ort/.test(hint[0]) && /können sich ändern/.test(hint[1]) && /immer geprüft/.test(hint[2]), hint.join(' | '));
  ok('LP5: keine Aktion in den Abschnitten', sec.querySelectorAll('a, button').length === 0 && d.querySelectorAll('.mr-notice-list a, .mr-notice-list button').length === 0);
  ok('LP5: weiterhin genau eine Aktion im Inhalt', d.querySelectorAll('main a, main button').length === 1);
  ok('LP5: Seite ohne Skripte', d.querySelectorAll('script').length === 0);
}async function productVision() {
  var f = await openFrame('../index.html', 1440, 900), d = f.contentDocument;
  var sec = d.querySelector('#lp6-vision').closest('section');
  ok('LP6: Abschnitt „Produktvision“ existiert', text(d, '#lp6-vision') === 'Produktvision');
  var heads = Array.prototype.map.call(sec.querySelectorAll('.mr-vision-text h3'), function (h) { return h.textContent.trim(); });
  ok('LP6: die vier Themen', JSON.stringify(heads) === JSON.stringify(['Bessere Entscheidungen im alpinen Raum', 'Transparenz', 'Risikobewusstsein', 'Zugang zu Informationen']), heads.join(' | '));
  var closing = sec.querySelector('.mr-vision-closing');

  var order = d.querySelector('#lp5-hinweis').compareDocumentPosition(sec.querySelector('h2')) & 4;
  ok('LP6: Abschnitt steht nach Datenquellen und Hinweis', order);
  var t = sec.textContent.toLowerCase();
  ['revolution', 'smart', 'einzigartig', 'bahnbrechend', 'innovativ', 'führend', 'weltweit', 'disrupt', 'investor', 'skalier', 'lösung', 'ki ', 'künstliche', 'sicher ', 'garantier', 'gpx', 'risk engine', 'terrain', 'ersetzt'].forEach(function (w) {
    ok('LP6: keine Floskel oder Übertreibung: ' + w.trim(), t.indexOf(w) === -1);
  });
  ok('LP6: keine Aktion im Abschnitt', sec.querySelectorAll('a, button').length === 0);
  ok('LP6: weiterhin genau eine Aktion im Inhalt', d.querySelectorAll('main a, main button').length === 1);
  ok('LP6: Seite ohne Skripte', d.querySelectorAll('script').length === 0);
}async function navigation(w, h) {
  var f = await openFrame('../index.html', w, h), d = f.contentDocument, de = d.documentElement, tag = 'LP7 ' + w + ' px: ';
  var links = Array.prototype.slice.call(d.querySelectorAll('header nav a'));
  var names = links.map(function (a) { return a.textContent.trim(); });
  ok(tag + 'Navigation: Karte, Alpine Risk Intelligence, Datenquellen, Über Mountain Radar', JSON.stringify(names) === JSON.stringify(['Karte', 'Alpine Risk Intelligence', 'Datenquellen', 'Über Mountain Radar']), names.join(' | '));
  ok(tag + 'Navigation ist beschriftet und liegt im Header', d.querySelectorAll('header nav[aria-label]').length === 1);
  var dead = [];
  for (var i = 0; i < links.length; i++) {
    var href = links[i].getAttribute('href');
    if (href.charAt(0) === '#') { if (!d.getElementById(href.slice(1))) dead.push(href); }
    else { var r = await fetch(new URL(href, f.contentWindow.location.href)); if (!r.ok) dead.push(href); }
  }
  ok(tag + 'keine toten Links (Anker und Seiten vorhanden)', dead.length === 0, dead.join(', '));
  var empty = Array.prototype.filter.call(d.querySelectorAll('a'), function (a) { return !a.getAttribute('href') || a.getAttribute('href') === '#'; });
  ok(tag + 'kein leerer Link', empty.length === 0);
  var targets = links.filter(function (a) { return a.getAttribute('href').charAt(0) === '#'; }).map(function (a) { return d.getElementById(a.getAttribute('href').slice(1)); });
  ok(tag + 'Anker zeigen auf vorhandene Abschnittsüberschriften', targets.length === 3 && targets.every(function (e) { return e && e.tagName === 'H2'; }));
  var fits = links.every(function (a) { var b = a.getBoundingClientRect(); return b.height >= 44 && b.left >= 0 && b.right <= w; });
  ok(tag + 'Links mindestens 44 px hoch und im Bildschirm', fits);
  ok(tag + 'kein waagerechter Überlauf', de.scrollWidth <= w, 'Breite ' + de.scrollWidth);
  links[1].click(); await wait(1200);
  var top = d.getElementById('lp4-ari').getBoundingClientRect().top;
  ok(tag + 'Klick springt zum Abschnitt', top >= -2 && top < h, 'oben ' + Math.round(top));
}
async function navigationDark() {
  // Dunkel folgt über die Tokens (prefers-color-scheme in style.css): Die Navigationsregeln dürfen keine festen Farben enthalten.
  var css = await (await fetch('../style.css')).text();
  var rules = css.split('\n').filter(function (l) { return /^\.mr-nav|^\s+\.mr-nav/.test(l); }).join('\n');
  ok('LP7 dunkel: Navigation nutzt nur Tokens (keine festen Farben)', rules.length > 0 && !/#[0-9a-f]{3,8}\b|rgb\(|hsl\(/i.test(rules), rules.length + ' Zeichen');
}
async function whatIsSmall(w) {
  var f = await openFrame('../index.html', w, 800), d = f.contentDocument;
  ok('LP2–LP6 ' + w + ' px: kein waagerechter Überlauf', d.documentElement.scrollWidth <= w, 'Breite ' + d.documentElement.scrollWidth);
}
async function heroVisual(w, h) {
  var f = await openFrame('../index.html', w, h), d = f.contentDocument, win = f.contentWindow;
  var hero = d.querySelector('.mr-hero'), cs = win.getComputedStyle(hero);
  ok('LP1b ' + w + ' px: Hero-Hintergrund enthält das Hero-Bild und ein Overlay', /mountain-radar-hero\.jpg/.test(cs.backgroundImage) && /gradient/.test(cs.backgroundImage), cs.backgroundImage.slice(0, 80));
  var title = win.getComputedStyle(d.querySelector('.mr-hero__title')).color, lead = win.getComputedStyle(d.querySelector('.mr-hero__lead')).color;
  ok('LP1b ' + w + ' px: Slogan und Einleitung sind hell auf dem Bild', title === 'rgb(255, 255, 255)' && lead === 'rgb(255, 255, 255)', title + ' / ' + lead);
  var b = d.querySelector('.mr-hero .mr-button').getBoundingClientRect(), r = hero.getBoundingClientRect();
  ok('LP1b ' + w + ' px: Aktion liegt im Hero und im Bildschirm', b.top >= r.top && b.bottom <= r.bottom && b.bottom <= h, 'unten ' + Math.round(b.bottom));
  ok('LP1b ' + w + ' px: Aktion ist hell auf dunklem Overlay', win.getComputedStyle(d.querySelector('.mr-hero .mr-button')).backgroundColor === 'rgb(255, 255, 255)');
}

async function landingBackground() {
  var f = await openFrame('../index.html', 1440, 900), d = f.contentDocument, win = f.contentWindow;
  var res = await fetch(new URL('docs/design/mountain-radar-hero.jpg', new URL('../index.html', location.href)));
  ok('LP1b: Hero-Bild ist erreichbar', res.ok && (await res.blob()).size > 10000);
  var sec = win.getComputedStyle(d.querySelector('.mr-section')).backgroundColor, card = win.getComputedStyle(d.querySelector('.mr-card--raised')).backgroundColor;
  var dark = win.matchMedia('(prefers-color-scheme: dark)').matches;
  ok('LP1b: Fläche ist ' + (dark ? 'im Dunkelmodus unverändert dunkel' : 'warmer Sandton (rot > grün > blau)'), dark ? sec === 'rgb(14, 22, 32)' : /rgb\((\d+), (\d+), (\d+)\)/.test(sec) && (function (m) { return +m[0] > +m[1] && +m[1] > +m[2] + 20; })(sec.match(/\d+/g)), sec);
  ok('LP1b: Infokarten bleiben weiß (hell) bzw. Kartenfläche (dunkel)', dark ? card === 'rgb(22, 33, 44)' : card === 'rgb(255, 255, 255)', card);
  // Kontrast der gedämpften Schrift auf der Landing-Fläche (WCAG AA: mind. 4,5)
  function lum(c) { return c.match(/\d+/g).slice(0, 3).map(function (v) { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }).reduce(function (a, v, i) { return a + v * [.2126, .7152, .0722][i]; }, 0); }
  var muted = win.getComputedStyle(d.querySelector('.mr-section__lead')).color, la = lum(muted), lb = lum(sec), ratio = (Math.max(la, lb) + .05) / (Math.min(la, lb) + .05);
  ok('LP1b: gedämpfte Schrift auf der Landing-Fläche mind. 4,5 : 1', ratio >= 4.5, ratio.toFixed(2));
}

async function appUnchanged() {
  var f = await openFrame('../app.html', 1440, 900), win = f.contentWindow, d = f.contentDocument;
  var dark = win.matchMedia('(prefers-color-scheme: dark)').matches;
  ok('LP1b: Anwendung behält ihre sachliche Fläche (kühles Grau bzw. Dunkelblau)', win.getComputedStyle(d.body).backgroundColor === (dark ? 'rgb(14, 22, 32)' : 'rgb(245, 247, 246)'), win.getComputedStyle(d.body).backgroundColor);
}

async function seo(page, title) {
  // LP8: Metadaten der Seite (Titel, Beschreibung, Open Graph, Twitter/X) und das Vorschaubild.
  var f = await openFrame('../' + page, 1024, 768), d = f.contentDocument, tag = 'LP8 ' + page + ': ';
  function meta(sel) { var e = d.querySelector(sel); return e ? (e.getAttribute('content') || '').trim() : ''; }
  var desc = meta('meta[name="description"]');
  ok(tag + 'Titel', d.title === title, d.title);
  ok(tag + 'Meta Description vorhanden (50 bis 160 Zeichen)', desc.length >= 50 && desc.length <= 160, desc.length + ' Zeichen');
  ok(tag + 'Open Graph: type, site_name, title, description, image', meta('meta[property="og:type"]') === 'website' && meta('meta[property="og:site_name"]') === 'Mountain Radar' && meta('meta[property="og:title"]') === title && meta('meta[property="og:description"]') === desc && meta('meta[property="og:image"]') !== '');
  ok(tag + 'Open Graph: Bild mit Größe und Alternativtext', meta('meta[property="og:image:width"]') === '1200' && meta('meta[property="og:image:height"]') === '630' && meta('meta[property="og:image:alt"]').length > 10);
  ok(tag + 'Twitter/X: große Karte mit Titel, Beschreibung, Bild', meta('meta[name="twitter:card"]') === 'summary_large_image' && meta('meta[name="twitter:title"]') === title && meta('meta[name="twitter:description"]') === desc && meta('meta[name="twitter:image"]') === meta('meta[property="og:image"]') && meta('meta[name="twitter:image:alt"]') !== '');
  var img = await new Promise(function (resolve) { var i = new Image(); i.onload = function () { resolve(i); }; i.onerror = function () { resolve(null); }; i.src = new URL(meta('meta[property="og:image"]'), f.contentWindow.location.href).href; });
  ok(tag + 'Vorschaubild ist erreichbar und 1200 × 630', img && img.naturalWidth === 1200 && img.naturalHeight === 630, img ? img.naturalWidth + ' × ' + img.naturalHeight : 'nicht ladbar');
}(async function () {
  try { await landing(); await small(390, 844); await small(320, 640); await lowWindow(); await appBackLink(); await whatIs(); await sources(); await vision(); await datasources(); await productVision(); await whatIsSmall(390); await whatIsSmall(320); await navigation(1440, 900); await navigation(390, 844); await navigation(320, 640); await navigationDark(); await heroVisual(1440, 900); await heroVisual(390, 844); await heroVisual(320, 640); await landingBackground(); await appUnchanged(); await seo('index.html', 'Mountain Radar – Alpine Risk Intelligence'); await seo('app.html', 'Karte – Mountain Radar'); }
  catch (e) { ok('Test ohne Ausnahme', false, String(e && e.stack || e)); }
  var passed = results.filter(function (r) { return r.ok; }).length;
  document.getElementById('result').textContent = JSON.stringify({ passed: passed, failed: results.length - passed, results: results });
})();
</script>
