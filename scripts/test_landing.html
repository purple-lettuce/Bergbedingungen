<!doctype html>
<meta charset="utf-8">
<title>Tests Landing Page (LP1 bis LP4)</title>
<pre id="result">läuft …</pre>
<div id="frames"></div>
<script>
// Läuft im Browser: python3 scripts/run_js_tests.py (oder diese Seite über einen Webserver im Repo-Stamm öffnen).
// Lädt die Startseite (index.html) in Rahmen unterschiedlicher Breite und prüft Marke, Claim, Slogan, genau einen Link zur Karte (der auf eine vorhandene Seite zeigt),
// fehlenden Überlauf und dass die Seite keine Skripte braucht. Außerdem: Die Anwendung (app.html) führt über die Marke zurück zur Startseite.
var results = [];
function ok(name, cond, detail) { results.push({ name: name, ok: !!cond, error: cond ? '' : 'nicht erfüllt' + (detail ? ': ' + detail : '') }); }
function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function openFrame(src, w, h) {
  return new Promise(function (resolve) {
    var f = document.createElement('iframe');
    f.style.cssText = 'display:block;border:0;width:' + w + 'px;height:' + h + 'px';
    f.src = src;
    f.addEventListener('load', function () { wait(500).then(function () { resolve(f); }); });
    document.getElementById('frames').appendChild(f);
  });
}
function text(d, sel) { var e = d.querySelector(sel); return e ? e.textContent.replace(/\s+/g, ' ').trim() : null; }

async function landing() {
  var f = await openFrame('../index.html', 1440, 900), d = f.contentDocument;
  ok('Marke: Emblem und Name als h1', d.querySelector('.mr-header img.mr-brand__emblem') && text(d, 'h1.mr-brand__name') === 'Mountain Radar');
  ok('Claim sichtbar', text(d, '.mr-brand__claim') === 'ALPINE RISK INTELLIGENCE');
  ok('Slogan sichtbar', text(d, '.mr-hero__title') === 'Know before you go.');
  var links = d.querySelectorAll('a, button');
  ok('genau eine Aktion: Link „Zur Karte“', links.length === 1 && links[0].textContent.trim() === 'Zur Karte' && links[0].getAttribute('href') === 'app.html', links.length + ' Aktionen');
  var res = await fetch(new URL(links[0].getAttribute('href'), f.contentWindow.location.href));
  ok('Ziel des Links ist erreichbar', res.ok, 'Status ' + res.status);
  ok('Seite braucht kein JavaScript', d.querySelectorAll('script').length === 0);
  ok('Die einzige Überschrift 1. Ebene ist der Produktname', d.querySelectorAll('h1').length === 1);
  var b = d.querySelector('.mr-button').getBoundingClientRect();
  ok('Aktion ist im ersten Bildschirm sichtbar (1440 × 900)', b.bottom <= 900 && b.height >= 44, 'unten ' + Math.round(b.bottom) + ', Höhe ' + Math.round(b.height));
  ok('Kein waagerechter Überlauf (1440 px)', d.documentElement.scrollWidth <= 1440);
}

async function small(w, h) {
  var f = await openFrame('../index.html', w, h), d = f.contentDocument, de = d.documentElement;
  var b = d.querySelector('.mr-button').getBoundingClientRect();
  ok(w + ' px: kein waagerechter Überlauf', de.scrollWidth <= w, 'Breite ' + de.scrollWidth);
  ok(w + ' px: Aktion liegt im Bildschirm und ist mindestens 44 px hoch', b.left >= 0 && b.right <= w && b.bottom <= h && b.height >= 44, Math.round(b.left) + '–' + Math.round(b.right) + ', unten ' + Math.round(b.bottom));
  var t = d.querySelector('.mr-hero__title').getBoundingClientRect();
  ok(w + ' px: Slogan liegt im Bildschirm', t.left >= 0 && t.right <= w);
}

async function lowWindow() {
  var f = await openFrame('../index.html', 667, 300), d = f.contentDocument, de = d.documentElement;
  var scrolls = de.scrollHeight > 300 && (f.contentWindow.scrollTo(0, de.scrollHeight), f.contentWindow.scrollY > 0);
  f.contentWindow.scrollTo(0, 0);
  ok('Niedriges Fenster (667 × 300): Seite scrollt, Aktion ist erreichbar', scrolls || de.scrollHeight <= 300);
  var b = d.querySelector('.mr-button').getBoundingClientRect();
  ok('Niedriges Fenster: Aktion nach dem Zurückscrollen an den Anfang sichtbar', b.top >= 0 && b.bottom <= 300, 'oben ' + Math.round(b.top) + ', unten ' + Math.round(b.bottom));
}

async function appBackLink() {
  var f = await openFrame('../app.html', 1440, 900), d = f.contentDocument, a = d.querySelector('a.mr-brand');
  ok('Anwendung: Marke im Header führt zur Startseite', a && a.getAttribute('href') === './' && text(d, 'a.mr-brand .mr-brand__name') === 'Mountain Radar');
}

async function whatIs() {
  var f = await openFrame('../index.html', 1440, 900), d = f.contentDocument;
  ok('LP2: Abschnitt „Was ist Mountain Radar?“ existiert', text(d, '#lp2-was') === 'Was ist Mountain Radar?');
  var cards = Array.prototype.map.call(d.querySelectorAll('#lp2-was ~ .mr-feature-grid h3'), function (h) { return h.textContent.trim(); });
  ok('LP2: genau die fünf vorhandenen Bereiche', JSON.stringify(cards) === JSON.stringify(['Wetter', 'Lawinenlage', 'Schutzgebiete', 'Wildlife', 'Sperrungen & Hinweise']), cards.join(', '));
  ok('LP2: Zielgruppen vorhanden', d.querySelectorAll('.mr-pills li').length === 5);
  var all = d.querySelector('#lp2-was').closest('section').textContent + d.querySelector('#lp2-fuer-wen').closest('section').textContent;
  ['Risk Engine', 'GPX', 'Terrain', 'Route Intelligence', 'automatisch', 'Roadmap', 'bald', 'geplant', 'künftig', 'Zukunft'].forEach(function (w) {
    ok('LP2: keine Zukunfts- oder Nicht-Funktion erwähnt: ' + w, all.toLowerCase().indexOf(w.toLowerCase()) === -1);
  });
  ok('LP2: weiterhin genau eine Aktion', d.querySelectorAll('a, button').length === 1);
  ok('LP2: Seite ohne Skripte', d.querySelectorAll('script').length === 0);
  var cs = f.contentWindow.getComputedStyle(d.querySelector('.mr-feature-grid .mr-card'));
  ok('LP2: Karten nutzen Token-Fläche', cs.backgroundColor !== 'rgba(0, 0, 0, 0)');
}
async function sources() {
  var f = await openFrame('../index.html', 1440, 900), d = f.contentDocument;
  var sec = d.querySelector('#lp3-quellen').closest('section');
  ok('LP3: Abschnitt „Aktuelle Informationsquellen“ existiert', text(d, '#lp3-quellen') === 'Aktuelle Informationsquellen');
  var cards = Array.prototype.map.call(sec.querySelectorAll('.mr-feature-grid h3'), function (h) { return h.textContent.trim(); });
  ok('LP3: genau die fünf vorhandenen Bereiche', JSON.stringify(cards) === JSON.stringify(['Wetter', 'Lawinenlage', 'Schutzgebiete', 'Wildlife', 'Sperrungen & Hinweise']), cards.join(', '));
  var empty = Array.prototype.filter.call(sec.querySelectorAll('.mr-feature-grid li'), function (li) { var p = li.querySelector('p'); return !p || !p.textContent.trim(); });
  ok('LP3: jede Karte hat Titel und Beschreibung', empty.length === 0);
  var t = sec.textContent.toLowerCase();
  ['Risk Engine', 'GPX', 'Terrain', 'Route', 'automatisch', 'Roadmap', 'bald', 'geplant', 'künftig', 'Zukunft', 'Coming', 'Risikobewertung'].forEach(function (w) {
    ok('LP3: keine Zukunfts- oder Nicht-Funktion erwähnt: ' + w, t.indexOf(w.toLowerCase()) === -1);
  });
  ok('LP3: keine Aktion im Abschnitt', sec.querySelectorAll('a, button').length === 0);
  ok('LP3: weiterhin genau eine Aktion auf der Seite', d.querySelectorAll('a, button').length === 1);
  ok('LP3: Seite ohne Skripte', d.querySelectorAll('script').length === 0);
}async function vision() {
  var f = await openFrame('../index.html', 1440, 900), d = f.contentDocument;
  var sec = d.querySelector('#lp4-ari').closest('section');
  ok('LP4: Abschnitt „Alpine Risk Intelligence“ existiert', text(d, '#lp4-ari') === 'Alpine Risk Intelligence');
  var themes = Array.prototype.map.call(sec.querySelectorAll('.mr-vision-grid h3'), function (h) { return h.textContent.trim(); });
  ok('LP4: genau die vier Zukunftsthemen', JSON.stringify(themes) === JSON.stringify(['GPX-Analyse', 'Risikoanalyse', 'Terrain Intelligence', 'Alpine Risk Engine']), themes.join(', '));
  var heads = Array.prototype.map.call(sec.querySelectorAll('.mr-vision-text h3'), function (h) { return h.textContent.trim(); });
  ok('LP4: die drei Erklärungen (Informationen allein, Kontext, zusammen)', heads.length === 3, heads.join(' | '));
  var badge = sec.querySelector('.mr-badge');
  ok('LP4: Vision ist als „Noch nicht verfügbar“ gekennzeichnet, vor den Zukunftsthemen', badge && badge.textContent.trim() === 'Noch nicht verfügbar' && (badge.compareDocumentPosition(sec.querySelector('.mr-vision-grid')) & 4));
  var cards = sec.querySelectorAll('.mr-vision-grid p');
  var allGoal = cards.length === 4 && Array.prototype.every.call(cards, function (p) { return p.textContent.trim().indexOf('Ziel:') === 0; });
  ok('LP4: jedes Zukunftsthema ist als Ziel formuliert', allGoal);
  ok('LP4: Zukunftsthemen stehen nur in diesem Abschnitt', Array.prototype.every.call(d.querySelectorAll('section'), function (s) { return s === sec || !/GPX|Risk Engine|Terrain|Risikoanalyse/.test(s.textContent); }));
  ok('LP4: Zukunftskarten unterscheiden sich von den aktuellen (nicht raised)', sec.querySelectorAll('.mr-card--raised').length === 0);
  var t = sec.textContent;
  ok('LP4: kein KI-Hype (KI, Künstliche Intelligenz)', !/\bKI\b|künstliche/i.test(t.replace(/Intelligence/g, '')));
  ['revolution', 'smart', 'einzigartig', 'bahnbrechend', 'machine learning', 'jetzt', 'ab sofort', 'bereits heute'].forEach(function (w) {
    ok('LP4: keine Hype- oder Gegenwartsformulierung: ' + w, t.toLowerCase().indexOf(w) === -1);
  });
  ok('LP4: keine Aktion im Abschnitt', sec.querySelectorAll('a, button').length === 0);
  ok('LP4: weiterhin genau eine Aktion auf der Seite', d.querySelectorAll('a, button').length === 1);
  ok('LP4: Seite ohne Skripte', d.querySelectorAll('script').length === 0);
  var cs = f.contentWindow.getComputedStyle(sec.querySelector('.mr-vision-grid .mr-card'));
  ok('LP4: Karten nutzen Token-Fläche', cs.backgroundColor !== 'rgba(0, 0, 0, 0)');
}
async function whatIsSmall(w) {
  var f = await openFrame('../index.html', w, 800), d = f.contentDocument;
  ok('LP2–LP4 ' + w + ' px: kein waagerechter Überlauf', d.documentElement.scrollWidth <= w, 'Breite ' + d.documentElement.scrollWidth);
}
(async function () {
  try { await landing(); await small(390, 844); await small(320, 640); await lowWindow(); await appBackLink(); await whatIs(); await sources(); await vision(); await whatIsSmall(390); await whatIsSmall(320); }
  catch (e) { ok('Test ohne Ausnahme', false, String(e && e.stack || e)); }
  var passed = results.filter(function (r) { return r.ok; }).length;
  document.getElementById('result').textContent = JSON.stringify({ passed: passed, failed: results.length - passed, results: results });
})();
</script>
